worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile       on;
    keepalive_timeout 65;
    client_max_body_size 5m;

    # Docker's embedded DNS: resolves upstream hostnames per-request (via the
    # $upstream variables below) instead of once at nginx startup, so the
    # gateway can start even if a backend container isn't up yet and picks up
    # container restarts without needing its own restart.
    resolver 127.0.0.11 valid=10s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # When this gateway sits behind another reverse proxy (e.g. a host-level
    # nginx doing TLS termination), preserve the scheme THAT proxy already
    # forwarded instead of overwriting it with this container's own (always
    # "http", since the outer proxy talks to it in plain HTTP). Falls back to
    # $scheme when there's no outer proxy (e.g. hitting the gateway directly).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;

        # ---- Global chat WebSocket (User Service) ----------------------------
        location /ws/chat {
            set $upstream_user http://user-service:8001;
            proxy_pass $upstream_user;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 3600s;
        }

        # ---- User Service: auth, profile, favourites, chat REST --------------
        location /api/v1/auth/ {
            set $upstream_user http://user-service:8001;
            proxy_pass $upstream_user;
            include proxy_params.conf;
        }

        location /api/v1/users/ {
            set $upstream_user http://user-service:8001;
            proxy_pass $upstream_user;
            include proxy_params.conf;
        }

        location /api/v1/chat/ {
            set $upstream_user http://user-service:8001;
            proxy_pass $upstream_user;
            include proxy_params.conf;
        }

        # ---- Recommendation Service: destinations, recommendations, directions,
        #      and its static destination images ------------------------------
        location /api/v1/destinations {
            set $upstream_recs http://recommendation-service:8002;
            proxy_pass $upstream_recs;
            include proxy_params.conf;
        }

        location /api/v1/recommendations {
            set $upstream_recs http://recommendation-service:8002;
            proxy_pass $upstream_recs;
            include proxy_params.conf;
        }

        location /api/v1/directions {
            set $upstream_recs http://recommendation-service:8002;
            proxy_pass $upstream_recs;
            include proxy_params.conf;
        }

        location /static/ {
            set $upstream_recs http://recommendation-service:8002;
            proxy_pass $upstream_recs;
            include proxy_params.conf;
        }

        # ---- Itinerary Service: trips and public share view -------------------
        location /api/v1/itineraries {
            set $upstream_trips http://itinerary-service:8003;
            proxy_pass $upstream_trips;
            include proxy_params.conf;
        }

        location /api/v1/public/itineraries {
            set $upstream_trips http://itinerary-service:8003;
            proxy_pass $upstream_trips;
            include proxy_params.conf;
        }

        # ---- Gateway's own liveness probe --------------------------------------
        location = /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        # ---- Frontend (React build, or the Vite dev server in local dev) -------
        location / {
            set $upstream_frontend http://frontend:5173;
            proxy_pass $upstream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
