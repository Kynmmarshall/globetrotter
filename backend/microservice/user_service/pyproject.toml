[project]
name = "globetrotter-user-service"
version = "0.1.0"
description = "GlobeTrotter Phase 2 User Service: auth, profile, favourites, and global chat."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "aio-pika>=9.4,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "httpx>=0.27,<1.0",
    "anyio>=4.4,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]
