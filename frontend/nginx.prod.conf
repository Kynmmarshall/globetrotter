# Serves the compiled Vite build (frontend/dist) as a single-page app.
# Only used by the "prod" stage of frontend/Dockerfile -- the gateway
# container proxies "/" to this server (see backend/microservice/gateway/nginx.conf).
# Serves the compiled Vite build (frontend/dist) as a single-page app.
# Only used by the "prod" stage of frontend/Dockerfile -- the gateway
# container proxies "/" to this server on port 5173 (see
# backend/microservice/gateway/nginx.conf's "$upstream_frontend"), the same
# internal port the Vite dev server uses, so the gateway config doesn't need
# to know or care whether the frontend container is running "dev" or "prod".
server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames (Vite adds a content hash) can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
